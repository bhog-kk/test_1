[package]
name = "neuro_expert"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "=1.3.3"
lazy_static = "1.5.1"
memmap2 = "0.9.12"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zstd = "0.14.3"
bytemuck = { version = "1.14", features = ["derive"]}
futures-intrusive = { version = "0.5.0", optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", optional = true }
rand = "0.10.3"
rand_chacha = "0.10.0"
tokenizers = "0.23.2"
criterion = "0.8.2"

[features]
default = ["gpu"] # <-- This automatically enables GPU support on standard builds
gpu = ["dep:wgpu", "dep:pollster", "dep:futures-intrusive"]
